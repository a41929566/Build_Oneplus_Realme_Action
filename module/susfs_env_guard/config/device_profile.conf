#
# ⚠ 分层说明:
#   [identity] 安全层 - 外观/身份/构建信息，仅影响 App 读到的值，默认应用
#   [deep]    危险层 - 平台/SoC/Vulkan/音频HAL/屏幕密度，默认【不应用】
#             你的真机是 Snapdragon，把平台伪装成麒麟会让 GPU/音频/厂商HAL 失效
#             除非你明确知道后果，否则保持 device_model_deep=0
#
